<aside class="sidebar" [class.open]="open()" [inert]="isMobile() && !open()" aria-label="Navegación principal">
  <a class="brand-lockup" routerLink="/app" (click)="onNavigate()" aria-label="San José, ir al inicio">
    <span class="brand-symbol" aria-hidden="true">SJ</span>
    <span class="brand-copy"><strong>San José</strong><small>Control de combustible</small></span>
  </a>

  <div class="branch-label"><span>Sede asignada</span><strong>{{ branchName() }}</strong></div>
  <nav class="nav-menu" aria-label="Menú principal">
    @for (item of navigation(); track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: item.path === '/app/dashboard' || item.path === '/app/attendances' }" (click)="onNavigate()">
            <span class="material-symbols-outlined nav-icon" aria-hidden="true">{{ icons[item.path] }}</span>
            <span>{{ item.label }}</span>
          </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>
  <div class="side-status"><span class="live-dot" aria-hidden="true"></span><span><strong>Información compartida</strong><small>San José y Santa Marta</small></span></div>
  <button class="profile-card" type="button" (click)="profileMenu.toggle($event)" aria-label="Abrir menú de perfil" aria-haspopup="dialog">
    <app-avatar [label]="(user()?.firstName?.slice(0, 1) ?? '') + (user()?.lastName?.slice(0, 1) ?? '')" ariaLabel="Perfil" />
    <span class="profile-copy"><strong>{{ user()?.firstName }} {{ user()?.lastName }}</strong><small>{{ roleLabel() }}</small></span>
    <span class="material-symbols-outlined profile-more" aria-hidden="true">more_vert</span>
  </button>
  <p-popover #profileMenu>
    <button class="profile-logout" type="button" (click)="profileMenu.hide(); logoutClick.emit()">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span> Cerrar sesión
    </button>
  </p-popover>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-button" type="button" aria-label="Abrir menú" (click)="menuClick.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
    </button>
    <div class="crumbs">Estación de Servicio <span aria-hidden="true">/</span> <strong>{{ pageTitle() }}</strong></div>
  </div>
  <div class="top-actions">
    <app-notifications-bell />
    <button class="logout-button" type="button" (click)="logoutClick.emit()">Cerrar sesión</button>
  </div>
</header>

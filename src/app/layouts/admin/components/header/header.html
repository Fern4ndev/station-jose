<header class="flex min-h-[78px] items-center justify-between gap-[20px] max-[760px]:min-h-[62px]">
  <div class="max-[760px]:flex max-[760px]:items-center max-[760px]:gap-[10px]">
    <button
      type="button"
      class="grid h-[39px] w-[39px] flex-none place-items-center rounded-[12px] border border-[#dfe6e7] bg-[rgba(255,255,255,0.73)] text-[#51646a] transition-colors hover:bg-white focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] hidden max-[760px]:grid"
      aria-label="Abrir menú"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="sidebar"
      (click)="menuToggle.emit()"
    >
      <app-ui-icon name="menu" [size]="17" [strokeWidth]="1.7" />
    </button>
    <div class="text-[11px] text-[#87949a] max-[760px]:text-[10px]">
      Estación de Servicio <span aria-hidden="true">/</span>
      <strong class="font-[620] text-[#263b43]">{{ pageLabel() }}</strong>
    </div>
  </div>

  <div class="flex items-center gap-[10px] max-[760px]:gap-[6px] max-[760px]:[&_app-notifications-bell]:hidden">
    <label
      class="flex h-[40px] w-[min(260px,_25vw)] items-center gap-[9px] rounded-[12px] border border-[rgba(210,221,222,0.95)] bg-[rgba(255,255,255,0.67)] p-[0_12px] text-[#829096] backdrop-blur-[18px] focus-within:max-[760px]:absolute focus-within:max-[760px]:left-[15px] focus-within:max-[760px]:right-[15px] focus-within:max-[760px]:top-[63px] focus-within:max-[760px]:z-[5] focus-within:max-[760px]:w-auto focus-within:max-[760px]:shadow-[0_8px_24px_rgba(20,47,49,0.14)] max-[760px]:w-[39px] max-[760px]:rounded-[12px] max-[760px]:p-[0_10px]"
    >
      <app-ui-icon name="search" [size]="15" [strokeWidth]="1.7" />
      <input
        id="globalSearch"
        type="search"
        class="w-full min-w-0 border-0 bg-transparent text-[11px] text-[#10202a] outline-none focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] max-[760px]:w-[0] max-[760px]:focus:w-full"
        placeholder="Buscar orden, vale…"
        aria-label="Buscar órdenes o vales"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>

    <app-notifications-bell />

  </div>
</header>

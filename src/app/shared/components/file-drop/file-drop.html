<label
  class="grid min-h-[85px] cursor-pointer place-items-center gap-[6px] rounded-[12px] border border-dashed p-[12px] text-center text-[11px] transition-colors"
  [class]="
    dragging()
      ? 'border-[#39c6ae] bg-[#eefaf6] text-[#2f6d59]'
      : 'border-[#bbd5d0] bg-[#f7fbfa] text-[#53746f]'
  "
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
    <path
      d="M12 16V4m0 0L8 8m4-4 4 4M5 17v1.6A1.4 1.4 0 0 0 6.4 20h11.2a1.4 1.4 0 0 0 1.4-1.4V17"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>

  @if (file(); as chosen) {
    <span class="font-[620] text-[#2f6d59]">{{ chosen.name }} · {{ fileSize() }}</span>
    <span class="text-[9px] text-[#89999b]">{{ label() }}</span>
  } @else {
    <span>{{ label() }}</span>
  }

  <input
    type="file"
    class="sr-only"
    [accept]="acceptAttr()"
    [attr.aria-label]="label()"
    (change)="onPick($event)"
  />

  @if (hint()) {
    <span class="text-[9px] text-[#89999b]">{{ hint() }}</span>
  }
</label>

@if (file()) {
  <button
    type="button"
    class="mt-[6px] rounded-[7px] px-[4px] text-[9px] font-[620] text-[#3a8176] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-[rgba(57,198,174,0.72)]"
    (click)="clear()"
  >
    Quitar archivo
  </button>
}

@if (error()) {
  <p class="m-0 text-[9px] leading-[1.5] text-[#a55a2c]" role="alert">{{ error() }}</p>
}

<p-dialog
  [header]="title()"
  [modal]="true"
  [visible]="visible()"
  [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <p>{{ message() }}</p>
  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" variant="text" (onClick)="visibleChange.emit(false)" />
    <p-button label="Eliminar" severity="danger" (onClick)="confirm()" />
  </ng-template>
</p-dialog>

@if (open()) {
  <div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/40 p-4" role="presentation" (click)="cancelled.emit()">
    <section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl" role="alertdialog" aria-modal="true" [attr.aria-label]="title()" (click)="$event.stopPropagation()">
      <h2 class="text-lg font-semibold text-slate-950">{{ title() }}</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ description() }}</p>
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" class="rounded-lg border px-4 py-2 text-sm" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
        <button type="button" class="rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
      </div>
    </section>
  </div>
}

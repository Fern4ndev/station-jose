<label class="grid gap-1.5 text-sm font-medium text-slate-600" [for]="id">
  <ng-content />
  <span class="relative block">
    <span class="material-symbols-outlined pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-500" aria-hidden="true">search</span>
    <input class="min-h-11 w-full rounded-lg border border-slate-300 bg-white pr-3 pl-10 text-sm text-slate-900" [id]="id" type="search" [formControl]="query" placeholder="Buscar" />
  </span>
</label>

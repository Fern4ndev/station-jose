<div class="flex flex-wrap gap-2" aria-label="Exportar reporte">
  <button type="button" class="inline-flex min-h-11 items-center gap-2 rounded-lg border px-3 py-2 text-sm disabled:opacity-50" [disabled]="disabled() || exporting()" (click)="export.emit('pdf')"><span class="material-symbols-outlined" aria-hidden="true">picture_as_pdf</span>Exportar PDF</button>
  <button type="button" class="inline-flex min-h-11 items-center gap-2 rounded-lg border px-3 py-2 text-sm disabled:opacity-50" [disabled]="disabled() || exporting()" (click)="export.emit('xlsx')"><span class="material-symbols-outlined" aria-hidden="true">download</span>Exportar Excel</button>
</div>

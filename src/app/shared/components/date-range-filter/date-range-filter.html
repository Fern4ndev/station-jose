<fieldset class="flex flex-wrap items-end gap-3">
  <legend class="mb-2 text-xs font-medium text-slate-600">Rango de fechas</legend>
  <label class="grid gap-1 text-xs text-slate-600">Desde<input class="min-h-10 rounded-lg border border-slate-300 bg-white px-3 text-sm" type="date" [value]="from()" (change)="updateFrom($event)" /></label>
  <label class="grid gap-1 text-xs text-slate-600">Hasta<input class="min-h-10 rounded-lg border border-slate-300 bg-white px-3 text-sm" type="date" [value]="to()" (change)="updateTo($event)" /></label>
</fieldset>

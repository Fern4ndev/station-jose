<div class="flex w-full items-center gap-[12px] overflow-x-auto border-t border-[#edf0f0] px-[10px] py-[8px]" [class.justify-end]="!label()" [class.justify-between]="!!label()">
  @if (label()) {
    <span class="shrink-0 text-[10px] text-[#8c999d]">{{ label() }}</span>
  }
  <p-paginator
    styleClass="sanjose-compact-paginator"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [alwaysShow]="true"
    [showFirstLastIcon]="false"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}-{last} de {totalRecords}"
    (onPageChange)="pageChange.emit($event)"
  />
</div>

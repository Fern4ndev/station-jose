<section
  class="min-w-0 rounded-[18px] border border-(--sanjose-panel-border) bg-(--sanjose-panel) shadow-(--sanjose-panel-shadow) max-[760px]:rounded-[15px]"
>
  @if (title() || subtitle()) {
    <div class="flex flex-wrap items-center justify-between gap-x-[12px] gap-y-[10px] p-[18px_20px_15px] max-[760px]:p-[16px_16px_13px]">
      <div class="min-w-0 flex-1">
        @if (title()) {
          <h3 class="m-0 text-[12px] font-[650] tracking-[-0.02em] text-[#22373e]">{{ title() }}</h3>
        }
        @if (subtitle()) {
          <p class="mt-[5px] mb-0 text-[9px] text-[#8c999d]">{{ subtitle() }}</p>
        }
      </div>
      <ng-content select="[panelAction]" />
    </div>
  }

  <ng-content />

  <ng-content select="[panelFooter]" />
</section>

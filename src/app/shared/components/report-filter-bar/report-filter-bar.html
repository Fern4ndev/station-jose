<div class="flex flex-wrap items-end gap-4 rounded-xl border bg-white p-4">
  <app-date-range-filter [from]="filters().from" [to]="filters().to" (rangeChange)="updateDateRange($event)" />
  <label class="grid gap-1 text-xs text-slate-600">Estado
    <select class="min-h-10 rounded-lg border border-slate-300 bg-white px-3 text-sm" [value]="filters().status" (change)="updateStatus($event)">
      <option value="">Todos</option><option value="PENDING">Pendiente</option><option value="VERIFIED">Verificado</option><option value="OBSERVED">Observado</option>
    </select>
  </label>
  <label class="grid gap-1 text-xs text-slate-600">Usuario
    <input class="min-h-10 rounded-lg border border-slate-300 bg-white px-3 text-sm" [value]="filters().userId" (change)="updateUser($event)" placeholder="ID de usuario" />
  </label>
</div>

  <div class="rounded-xl border p-4"><dt class="text-xs text-slate-500">Atendido</dt><dd class="mt-1 text-base font-semibold"><app-gallons-display [value]="attended()" /></dd></div>
  <div class="rounded-xl border p-4"><dt class="text-xs text-slate-500">Saldo informado</dt><dd class="mt-1 text-base font-semibold"><app-gallons-display [value]="available()" /></dd></div>

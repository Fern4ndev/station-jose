<div
  class="flex items-center justify-between gap-[14px] border-b border-[#edf0f0] p-[16px_20px] max-[760px]:flex-col max-[760px]:items-start"
>
  <div class="flex flex-wrap items-center gap-[16px]">
    <span class="text-[11px] text-[#87949a]">
      <strong class="font-[620] text-[#263b43]">{{ total() }}</strong>
      {{ total() === 1 ? 'combustible' : 'combustibles' }}
    </span>

    <label class="flex items-center gap-[7px] text-[11px] text-[#52636a]">
      <span class="whitespace-nowrap">Estado</span>
      <p-select
        [options]="filters"
        optionLabel="label"
        optionValue="value"
        [ngModel]="status()"
        (ngModelChange)="onStatus($event)"
        ariaLabel="Filtrar combustibles por estado"
        size="small"
        styleClass="w-[140px]"
      />
    </label>
  </div>

  <div class="relative w-full max-w-[280px] max-[760px]:max-w-none">
    <iconify-icon
      icon="mdi:magnify"
      class="pointer-events-none absolute left-[12px] top-1/2 -translate-y-1/2 text-[#87949a]"
      height="16"
      aria-hidden="true"
    ></iconify-icon>
    <input
      id="fuelTypeSearch"
      class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white pl-[34px] pr-[13px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      type="search"
      placeholder="Buscar por nombre"
      aria-label="Buscar combustibles por nombre"
      [value]="query()"
      (input)="onQuery($event)"
    />
  </div>
</div>

<div class="w-full overflow-x-auto">
  <table
    class="w-full border-collapse text-left [&_tbody_tr:hover]:bg-[rgba(238,247,244,0.5)] [&_tbody_tr:last-child>td]:border-b-0"
    aria-label="Catálogo de combustibles"
  >
    <thead>
      <tr>
        <th class="w-[56px] border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[10px] py-[8px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">N°</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[10px] py-[8px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">NOMBRE</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[10px] py-[8px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">ESTADO</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[10px] py-[8px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">ACCIONES</th>
      </tr>
    </thead>
    <tbody>
      @for (row of pageRows(); track row.id) {
        <tr>
          <td class="w-[56px] border-b border-[#eff2f2] px-[10px] py-[10px] text-[11px] whitespace-nowrap text-[#8b989c]">
            {{ rowNumber($index) }}
          </td>
          <td class="border-b border-[#eff2f2] px-[10px] py-[10px] text-[11px] whitespace-nowrap text-[#52636a]">
            {{ row.name }}
          </td>
          <td class="border-b border-[#eff2f2] px-[10px] py-[10px] text-[11px] whitespace-nowrap text-[#52636a]">
            @if (row.active) {
              <app-ui-status-badge label="Activo" tone="green" />
            } @else {
              <app-ui-status-badge label="Inactivo" tone="gray" />
            }
          </td>
          <td class="border-b border-[#eff2f2] px-[10px] py-[10px] text-[11px] whitespace-nowrap text-[#52636a]">
            <div class="flex items-center gap-[6px]">
              <button
                type="button"
                class="grid h-[31px] w-[31px] place-items-center rounded-[9px] border border-[#e5eaea] bg-white text-[#5d7477] transition-colors focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] enabled:hover:border-[#a9d8cd] enabled:hover:bg-[#fbfdfc] enabled:hover:text-[#287e6e] disabled:cursor-not-allowed disabled:opacity-45"
                title="Editar combustible"
                [attr.aria-label]="'Editar ' + row.name"
                [disabled]="busyId() === row.id"
                (click)="edit.emit(row)"
              >
                <app-ui-icon name="edit" [size]="14" />
              </button>

              <button
                type="button"
                class="relative h-[20px] w-[34px] cursor-pointer rounded-full border-0 bg-[#cbd4d4] p-0 transition-colors after:absolute after:top-[3px] after:left-[3px] after:h-[14px] after:w-[14px] after:rounded-full after:bg-white after:shadow-[0_1px_3px_rgba(0,0,0,0.15)] after:transition-transform after:content-[''] data-[on]:bg-[#51b89e] data-[on]:after:translate-x-[14px] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] motion-reduce:transition-none motion-reduce:after:transition-none disabled:cursor-not-allowed disabled:opacity-45"
                [attr.data-on]="row.active || null"
                [attr.aria-pressed]="row.active"
                [attr.aria-label]="(row.active ? 'Desactivar ' : 'Activar ') + row.name"
                [disabled]="busyId() === row.id"
                (click)="toggle.emit(row)"
              ></button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="border-b border-[#eff2f2] px-[10px] py-[10px] text-[11px] whitespace-nowrap text-[#52636a]" colspan="4">
            <div class="p-[36px_20px] text-center text-[11px] text-[#8b989c]">
              No hay combustibles que coincidan con la búsqueda.
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-table-pagination
  [first]="first()"
  [rows]="pageSize()"
  [totalRecords]="rows().length"
  [label]="rows().length === 1 ? '1 combustible' : rows().length + ' combustibles'"
  (pageChange)="onPage($event)"
/>

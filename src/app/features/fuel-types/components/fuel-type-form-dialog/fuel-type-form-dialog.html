<app-ui-dialog
  [(visible)]="visible"
  [title]="title()"
  description="Los combustibles activos están disponibles al registrar órdenes de compra."
>
  <form id="fuelTypeForm" class="grid gap-[13px]" (submit)="onSubmit($event)" novalidate>
    <div class="grid gap-[6px]">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="fuelTypeName">Nombre</label>
      <input
        id="fuelTypeName"
        class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[13px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
        placeholder="Ej. Diésel S50"
        maxlength="100"
        [value]="name()"
        (input)="setName($event)"
      />
    </div>

    @if (shownError()) {
      <p class="m-0 text-[9px] leading-[1.5] text-[#a55a2c]" role="alert">{{ shownError() }}</p>
    }
  </form>

  <div dialogFooter class="flex justify-end gap-[8px]">
    <button
      type="button"
      class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-[#dce5e6] bg-[rgba(255,255,255,0.72)] px-[16px] text-[11px] font-[620] whitespace-nowrap text-[#53656a] transition-[background,box-shadow] hover:bg-white focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      (click)="visible.set(false)"
    >
      Cancelar
    </button>
    <button
      type="submit"
      form="fuelTypeForm"
      class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent bg-(--sanjose-primary-action) px-[16px] text-[11px] font-[620] whitespace-nowrap text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] transition-[background,box-shadow] hover:bg-(--sanjose-primary-action-hover) focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      [disabled]="saving()"
    >
      {{ saving() ? 'Guardando…' : isEditing() ? 'Guardar cambios' : 'Registrar combustible' }}
    </button>
  </div>
</app-ui-dialog>

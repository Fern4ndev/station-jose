<app-ui-dialog [(visible)]="visible" [title]="title()" description="Revisa todos los campos antes de guardar la orden.">
  <form id="orderForm" class="grid grid-cols-2 gap-[13px] max-[760px]:grid-cols-1" (submit)="onSubmit($event)" novalidate>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">Número de orden
      <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[11px]" [readonly]="!!order()" [value]="number()" (input)="set('number', $event)" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">Número SIAF
      <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[11px]" [value]="siaf()" (input)="set('siaf', $event)" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">Fecha de emisión
      <p-datepicker [ngModel]="dateValue()" (ngModelChange)="onDate($event)" [ngModelOptions]="{standalone:true}" dateFormat="dd/mm/yy" [showIcon]="true" [readonlyInput]="true" inputId="orderIssueDate" styleClass="w-full" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">Sede proveedora
      <p-select [options]="branchOptions()" optionLabel="label" optionValue="value" [ngModel]="branch()" (ngModelChange)="branch.set($event)" [ngModelOptions]="{standalone:true}" placeholder="Selecciona una sede" styleClass="w-full" size="small" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">Nombre de la institución
      <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[11px]" maxlength="200" autocomplete="organization" [value]="institutionName()" (input)="set('institutionName', $event)" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a]">RUC de la institución
      <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[11px]" inputmode="numeric" maxlength="11" autocomplete="off" [value]="institutionRuc()" (input)="set('institutionRuc', $event)" />
    </label>
    <label class="grid gap-[6px] text-[11px] text-[#52646a] col-span-full">Nota (opcional)
      <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[11px]" [value]="supplierDetails()" (input)="set('supplierDetails', $event)" />
    </label>
    <div class="col-span-full grid gap-[10px]">
      <strong class="text-[11px] text-[#263d44]">Líneas de combustible</strong>
      @for (line of lines(); track $index; let index = $index) {
        <div class="grid grid-cols-[2fr_1fr_1fr_auto] gap-[8px] max-[760px]:grid-cols-2">
          <label class="grid gap-[4px] text-[10px] text-[#52646a]">Combustible
            <p-select [options]="fuelOptions()" optionLabel="label" optionValue="value" [ngModel]="line.fuel_type_id" (ngModelChange)="setFuel(index, $event)" [ngModelOptions]="{standalone:true}" placeholder="Selecciona" styleClass="w-full" size="small" />
          </label>
          <label class="grid gap-[4px] text-[10px] text-[#52646a]">Galones
            <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[9px]" type="number" min="0.001" step="0.001" [value]="line.gallons" (input)="setLine(index, 'gallons', $event)" />
          </label>
          <label class="grid gap-[4px] text-[10px] text-[#52646a]">Precio unitario
            <input class="min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[9px]" type="number" min="0" step="0.0001" [value]="line.unit_price" (input)="setLine(index, 'unit_price', $event)" />
          </label>
          <button type="button" class="self-end min-h-[39px] rounded-[10px] border border-[#dce5e5] px-[9px] text-[11px]" [disabled]="lines().length === 1" (click)="removeLine(index)" [attr.aria-label]="'Quitar línea ' + (index + 1)">Quitar</button>
        </div>
      }
      <button type="button" class="justify-self-start rounded-[10px] border border-[#dce5e5] px-[12px] py-[8px] text-[11px]" (click)="addLine()">Agregar combustible</button>
    </div>
    @if (!order()) {
      <label class="col-span-full grid gap-[6px] rounded-[12px] border border-dashed border-[#bbd5d0] bg-[#f7fbfa] p-[12px] text-[11px] text-[#53746f]">PDF de orden (opcional)
        <input type="file" accept="application/pdf,.pdf" (change)="onPdf($event)" [disabled]="loadingOcr()" />
        <span>{{ pdfLabel() }}</span>
      </label>
    }
    @if (error()) { <p class="col-span-full m-0 text-[11px] text-[#a55a2c]" role="alert">{{ error() }}</p> }
  </form>
  <div dialogFooter class="flex justify-end gap-[8px]">
    <button type="button" class="min-h-[39px] rounded-[11px] border border-[#dce5e6] bg-white px-[13px] text-[11px]" (click)="visible.set(false)">Cancelar</button>
    <button type="submit" form="orderForm" class="min-h-[39px] rounded-[11px] bg-(--sanjose-primary-action) px-[13px] text-[11px] text-white disabled:cursor-not-allowed disabled:opacity-45" [disabled]="loadingOcr() || saving() || !dirty()">{{ saving() ? 'Guardando…' : 'Guardar orden' }}</button>
  </div>
</app-ui-dialog>

<app-ui-toast />

<div class="animate-[fadeIn_230ms_ease_both]">
  <app-ui-page-heading
    title="Órdenes de compra"
    subtitle="Consulta autorizaciones y saldo disponible por combustible."
  >
    @if (canManage()) {
      <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] border-[#dce5e6] bg-[rgba(255,255,255,0.72)] text-[#53656a] hover:bg-white" (click)="openNew()">
        <app-ui-icon name="orders" [size]="14" />
        Importar PDF
      </button>
      <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover)" (click)="openNew()">
        <app-ui-icon name="plus" [size]="14" />
        Nueva orden
      </button>
    }
  </app-ui-page-heading>

  <app-ui-panel>
    <app-orders-toolbar
      [filter]="filter()"
      [query]="query()"
      (filterChange)="filter.set($event)"
      (queryChange)="query.set($event)"
    />

    <app-orders-table
      [rows]="rows()"
      [canManage]="canManage()"
      [lockedOrderIds]="lockedIds()"
      (view)="openDetail($event)"
      (edit)="openEdit($event)"
      (remove)="askDelete($event)"
    />

    <div
      panelFooter
      class="flex items-center justify-between gap-[12px] p-[17px_18px_13px] max-[760px]:p-[15px_14px_12px]"
    >
      <p class="m-0 text-[9px] text-[#8c999d]">{{ countText() }}</p>
      <button type="button" class="inline-flex min-h-[30px] cursor-pointer items-center gap-[5px] border-0 bg-transparent px-[4px] text-[10px] font-[630] text-(--sanjose-accent) focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]" (click)="loadMore()">Cargar más</button>
    </div>
  </app-ui-panel>

  <app-order-form-dialog
    [(visible)]="formOpen"
    [order]="editing()"
    [takenIds]="takenIds()"
    (saved)="save($event)"
  />

  <app-order-detail-dialog [(visible)]="detailOpen" [order]="selected()" />

  <app-ui-confirm-dialog
    [(visible)]="deleteOpen"
    title="Eliminar orden"
    [message]="'Se eliminará la orden ' + (selected()?.id ?? '') + '. Esta acción no se puede deshacer.'"
    confirmLabel="Eliminar"
    (confirmed)="confirmDelete()"
  />
</div>

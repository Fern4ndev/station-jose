<div
  class="flex items-center justify-between gap-[12px] border-b border-[#edf0f0] p-[12px_15px] max-[760px]:flex-col max-[760px]:items-start"
>
  <div class="flex flex-wrap items-center gap-[7px]" role="group" aria-label="Filtrar vales">
    @for (option of filters; track option.value) {
      <button
        type="button"
        class="min-h-[30px] cursor-pointer rounded-[9px] border border-[#e2e8e8] bg-white px-[10px] text-[10px] text-[#607076] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] data-[selected]:border-[#b8ddd3] data-[selected]:bg-[#ecf8f4] data-[selected]:text-[#2c796d]"
        [attr.data-selected]="option.value === filter() || null"
        [attr.aria-pressed]="option.value === filter()"
        (click)="filterChange.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <input
    id="voucherSearch"
    class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] max-w-[250px] max-[760px]:w-full max-[760px]:max-w-none"
    type="search"
    placeholder="Número, entidad u orden"
    aria-label="Buscar vales"
    [value]="query()"
    (input)="onQuery($event)"
  />
</div>

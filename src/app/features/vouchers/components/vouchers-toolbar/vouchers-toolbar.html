<div
  class="flex items-center justify-between gap-[14px] border-b border-[#edf0f0] p-[16px_20px] max-[760px]:flex-col max-[760px]:items-start"
>
  <label class="flex items-center gap-[7px] text-[11px] text-[#52636a]">
    <span class="whitespace-nowrap">Estado</span>
    <p-select
      [options]="filters"
      optionLabel="label"
      optionValue="value"
      [ngModel]="filter()"
      (ngModelChange)="filterChange.emit($event)"
      ariaLabel="Filtrar vales por estado"
      size="small"
      styleClass="w-[150px]"
    />
  </label>

  <input
    id="voucherSearch"
    class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[13px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] max-w-[250px] max-[760px]:w-full max-[760px]:max-w-none"
    type="search"
    placeholder="Número, entidad u orden"
    aria-label="Buscar vales"
    [value]="query()"
    (input)="onQuery($event)"
  />
</div>

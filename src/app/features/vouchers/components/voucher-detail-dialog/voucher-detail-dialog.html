<app-ui-dialog
  [(visible)]="visible"
  [title]="'Vale ' + (voucher()?.id ?? '')"
  [description]="(voucher()?.issuer ?? '') + ' · ' + (voucher()?.orderId ?? '')"
>
  @if (voucher(); as detail) {
    <div class="grid gap-[18px]">
      @for (line of detail.lines ?? []; track line.id) {
        <div class="grid gap-[5px] rounded-[10px] border border-[#e5eaea] p-[13px] text-[10px] text-[#52636a]">
          <strong class="text-[11px] text-[#263d44]">{{ line.fuel }}</strong>
          <span>Autorizado: {{ gallons(line.authorized) }}</span>
          <span>Atendido: {{ gallons(line.attended) }}</span>
          <span>Disponible: {{ gallons(line.available) }}</span>
        </div>
      }

      <div
        class="flex items-center justify-between gap-[12px] rounded-[12px] border border-[#dceee8] bg-[#f2faf6] p-[15px_16px] text-[10px] text-[#386e61]"
      >
        <span>Saldo restante del vale</span>
        <strong class="text-[14px] tracking-[-0.03em] text-[#225d50]">{{ balance() }}</strong>
      </div>

      <div class="flex items-center justify-between gap-[12px] text-[10px] text-[#77868b]">
        <span>Estado del vale</span>
        <strong class="text-[11px] font-[650] text-[#263d44]">{{ status() }}</strong>
      </div>
    </div>
  }

  <div dialogFooter class="flex justify-end gap-[8px]">
    <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover)" (click)="visible.set(false)">
      Listo
    </button>
  </div>
</app-ui-dialog>

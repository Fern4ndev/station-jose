<a [routerLink]="route()" class="group flex h-full min-h-32 items-start gap-4 rounded-2xl border border-slate-200 bg-white p-5 text-slate-900 shadow-sm transition hover:border-emerald-300 hover:shadow-md focus-visible:outline-emerald-600">
  <span aria-hidden="true" class="grid size-11 shrink-0 place-items-center rounded-xl bg-emerald-50 text-emerald-800"><span class="material-symbols-outlined">{{ symbol() }}</span></span>
  <span class="min-w-0 flex-1"><strong class="block text-sm font-semibold">{{ title() }}</strong><span class="mt-1 block text-sm leading-5 text-slate-600">{{ description() }}</span></span>
  <span aria-hidden="true" class="material-symbols-outlined text-slate-400 group-hover:text-emerald-700">arrow_forward</span>
</a>

<div
  class="mb-[18px] grid grid-cols-[repeat(3,minmax(0,1fr))] gap-[14px] max-[760px]:mb-[12px] max-[760px]:grid-cols-[repeat(2,minmax(0,1fr))] max-[760px]:gap-[10px]"
  aria-label="Resumen de hoy"
>
  @for (metric of metrics(); track metric.id) {
    <app-ui-stat-card
      [label]="metric.label"
      [value]="metric.value"
      [suffix]="metric.suffix ?? ''"
      [note]="metric.note"
      [noteLead]="metric.noteLead ?? ''"
      [icon]="metric.icon"
      [tone]="metric.tone"
    />
  }
</div>

<div class="animate-[fadeIn_230ms_ease_both]">
  <app-ui-page-heading [title]="'Buen día, ' + firstName()" [subtitle]="subtitle()">
    <span class="text-[11px] text-[#87949a] max-[760px]:text-[10px]">{{ today }}</span>
    @if (role() !== 'ATTENDANT') {
      <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] border-[#dce5e6] bg-[rgba(255,255,255,0.72)] text-[#53656a] hover:bg-white" (click)="goReports()">
        <app-ui-icon name="reports" [size]="14" />
        Ver reportes
      </button>
    }
  </app-ui-page-heading>

  <app-dashboard-metrics [metrics]="metrics()" />

  @if (role() === 'ADMIN') {
    <app-ui-panel title="Historial de atenciones" [subtitle]="'Despachos registrados en ' + scope()">
      <app-table-refresh panelAction [loading]="refreshing()" (refresh)="refresh()" />
      <app-attendance-history [rows]="recent()" />
    </app-ui-panel>
  } @else {
    <app-dashboard-activity [rows]="recent()" [scope]="scope()" [refreshing]="refreshing()" (refresh)="refresh()" (viewAll)="goAttendances()" />
  }
</div>

<app-ui-panel title="Galones despachados" subtitle="Actividad por sede">
  <app-ui-status-badge panelAction [label]="badge()" tone="green" />
  <div class="p-[8px_20px_18px]">
    @if (buckets().length) {
      <div class="h-[250px] w-full" role="img" [attr.aria-label]="'Gráfico de galones despachados por sede, ' + badge()">
        <p-chart type="bar" [data]="chartData()" [options]="chartOptions" height="250px" />
      </div>
      <table class="sr-only">
        <caption>Galones despachados por sede y período</caption>
        <thead><tr><th>Período</th><th>San José</th><th>Santa Marta</th></tr></thead>
        <tbody>@for (bucket of buckets(); track bucket.label) { <tr><td>{{ bucket.label }}</td><td>{{ bucket.sanJose }}</td><td>{{ bucket.santaMarta }}</td></tr> }</tbody>
      </table>
    } @else {
      <p class="flex h-[250px] items-center justify-center text-[11px] text-[#65777b]">No hay datos para el rango seleccionado.</p>
    }
  </div>
</app-ui-panel>

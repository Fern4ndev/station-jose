<app-ui-panel title="Resumen operativo" subtitle="Saldos del rango aplicado">
  <div class="grid gap-[18px] p-[6px_20px_22px]">
    <div class="flex items-center justify-between gap-[12px] text-[10px] text-[#77868b]">
      <span>Combustible autorizado</span>
      <strong class="text-[11px] font-[650] text-[#263d44]">{{ summary().authorized }}</strong>
    </div>
    <div class="flex items-center justify-between gap-[12px] text-[10px] text-[#77868b]">
      <span>Combustible despachado</span>
      <strong class="text-[11px] font-[650] text-[#263d44]">{{ summary().dispatched }}</strong>
    </div>

    <div>
      <div class="mb-[8px] flex items-center justify-between gap-[12px] text-[10px] text-[#77868b]">
        <span>Saldo disponible</span>
        <strong class="text-[11px] font-[650] text-[#263d44]">{{ summary().balance }}</strong>
      </div>
      <div class="h-[6px] overflow-hidden rounded-[99px] bg-[#e7eeee]">
        <div
          class="h-full rounded-[inherit] bg-[linear-gradient(90deg,#59bea6,#a4dbc3)]"
          [style.width]="width()"
        ></div>
      </div>
    </div>

    <div class="flex items-center justify-between gap-[12px] text-[10px] text-[#77868b]">
      <span>Vales atendidos</span>
      <strong class="text-[11px] font-[650] text-[#263d44]">{{ summary().vouchers }}</strong>
    </div>
  </div>
</app-ui-panel>

<app-ui-toast />

<div class="animate-[fadeIn_230ms_ease_both]">
  <app-ui-page-heading
    title="Reportes"
    subtitle="Consulta actividad y saldos por período, sede, usuario o estado."
  >
    <select
      id="reportPeriod"
      class="min-h-[39px] w-full appearance-auto rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] !w-auto"
      aria-label="Período del reporte"
      [value]="period()"
      (change)="onPeriod($event)"
    >
      @for (option of periods; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>

    <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover)" (click)="exportCsv()">
      <app-ui-icon name="download" [size]="14" />
      Exportar
    </button>
  </app-ui-page-heading>

  <app-report-metrics [metrics]="metrics()" />

  <div
    class="grid grid-cols-[minmax(0,1.45fr)_minmax(240px,0.75fr)] gap-[13px] max-[760px]:grid-cols-[1fr] max-[760px]:gap-[10px]"
  >
    <app-report-chart [buckets]="dataset().buckets" [badge]="dataset().badge" />
    <app-report-summary [summary]="summary()" />
  </div>
</div>

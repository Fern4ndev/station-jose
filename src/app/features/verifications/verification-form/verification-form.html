<form class="grid gap-4" [formGroup]="form()" (ngSubmit)="submitDecision.emit()" [attr.aria-busy]="submitting()">
  <fieldset class="grid gap-2"><legend class="text-sm font-medium">Resultado de la revisión</legend>
    <label class="flex items-center gap-2 text-sm"><input type="radio" value="VERIFIED" formControlName="decision" />Verificado: coincide con el documento</label>
    <label class="flex items-center gap-2 text-sm"><input type="radio" value="OBSERVED" formControlName="decision" />Observado: hay una diferencia</label>
  </fieldset>
  @if (form().controls.decision.value === 'OBSERVED') {
    <label class="grid gap-1.5 text-sm">Describe la diferencia<textarea class="rounded-lg border px-3 py-2" rows="4" maxlength="2000" formControlName="observation" required></textarea></label>
  }
  <p class="text-xs text-slate-500">La verificación no edita ni elimina la atención ni sus cantidades.</p>
  <div class="flex justify-end gap-3"><button type="button" class="rounded-lg border px-4 py-2 text-sm" (click)="cancel.emit()">Cancelar</button><button type="submit" class="rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white" [disabled]="!enabled() || !canSubmit() || submitting()">Registrar decisión</button></div>
</form>

<form class="grid grid-cols-2 gap-[13px] max-[760px]:grid-cols-1" (submit)="onSubmit($event)" novalidate>
  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <label id="attendanceInstitutionLabel" class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceInstitution">Institución</label>
    <p-autocomplete
      inputId="attendanceInstitution"
      [suggestions]="institutionSuggestions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="institutionRuc()"
      (ngModelChange)="institutionRuc.set($event ?? '')"
      [ngModelOptions]="{standalone:true}"
      (completeMethod)="searchInstitutions($event)"
      [minQueryLength]="1"
      [forceSelection]="true"
      [showEmptyMessage]="true"
      ariaLabelledBy="attendanceInstitutionLabel"
      placeholder="Escribe el nombre o RUC"
      emptyMessage="No hay coincidencias con órdenes disponibles"
      styleClass="w-full"
      panelStyleClass="text-[11px]"
      [inputStyle]="{ height: '39px', minHeight: '39px', padding: '0 11px', fontSize: '11px', lineHeight: '16.5px', borderRadius: '10px' }"
      inputStyleClass="w-full border border-[#dce5e5] bg-white text-[#30464d] placeholder:text-[#a5b1b4] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
    />
  </div>

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceOrder">Orden de compra</label>
    <p-select inputId="attendanceOrder" [options]="purchaseOrderOptions()" optionLabel="label" optionValue="value" [disabled]="!institutionRuc()" [ngModel]="purchaseOrderId()" (ngModelChange)="purchaseOrderId.set($event)" [ngModelOptions]="{standalone:true}" placeholder="Selecciona una orden de la institución" emptyMessage="La institución no tiene órdenes con saldo" styleClass="w-full" size="small" />
  </div>

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceFuelLine">Combustible de la orden</label>
    <p-select inputId="attendanceFuelLine" [options]="fuelLineOptions()" optionLabel="label" optionValue="value" [disabled]="!purchaseOrderId()" [ngModel]="orderId()" (ngModelChange)="orderId.set($event)" [ngModelOptions]="{standalone:true}" placeholder="Selecciona el combustible" emptyMessage="La orden no tiene combustibles con saldo" styleClass="w-full" size="small" />
  </div>

  <div class="grid gap-[6px]">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceVoucher">Número de vale</label>
    <input
      id="attendanceVoucher"
      class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      placeholder="Ej. VM-2026-0142"
      [value]="voucherId()"
      (input)="setVoucher($event)"
    />
    <span class="text-[9px] leading-[1.5] text-[#919da0]" id="attendanceVoucherHint">{{ hint() }}</span>
  </div>

  <div class="grid gap-[6px]">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceIssuerType">Tipo de emisor</label>
    <p-select inputId="attendanceIssuerType" [options]="issuerTypes" optionLabel="label" optionValue="value" [disabled]="locked()" [ngModel]="issuerType()" (ngModelChange)="issuerType.set($event)" [ngModelOptions]="{standalone:true}" styleClass="w-full" size="small" />
  </div>

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceIssuer">Nombre del emisor</label>
    <input
      id="attendanceIssuer"
      class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      placeholder="Nombre según vale físico"
      [readonly]="locked()"
      [value]="issuer()"
      (input)="setIssuer($event)"
    />
  </div>

  <div class="grid gap-[6px]">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceAuthorized">Galones autorizados en el vale</label>
    <input
      id="attendanceAuthorized"
      class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      type="number"
      min="0.001"
      step="0.001"
      placeholder="0.000"
      [readonly]="locked()"
      [value]="authorized()"
      (input)="setAuthorized($event)"
    />
  </div>

  <div class="grid gap-[6px]">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceGallons">Galones entregados hoy</label>
    <input
      id="attendanceGallons"
      class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
      type="number"
      min="0.001"
      step="0.001"
      placeholder="0.000"
      [value]="gallons()"
      (input)="setGallons($event)"
    />
  </div>

  <div class="grid gap-[6px]">
    <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="attendanceBranch">Sede de despacho</label>
    <p-select inputId="attendanceBranch" [options]="branches" optionLabel="label" optionValue="value" [disabled]="branchLocked()" [ngModel]="branchValue()" (ngModelChange)="branchValue.set($event)" [ngModelOptions]="{standalone:true}" styleClass="w-full" size="small" />
  </div>

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <span class="mb-0 block text-[10px] font-[620] text-[#52646a]">Saldo de la orden</span>
    <div
      class="flex items-center justify-between gap-[12px] rounded-[12px] border border-[#dceee8] bg-[#f2faf6] p-[13px_14px] text-[10px] text-[#386e61]"
    >
      <span>
        Disponible antes del despacho
        <span class="text-[9px] leading-[1.5] text-[#919da0]">{{ selectedOrder()?.fuel ?? '' }}</span>
      </span>
      <strong class="text-[14px] tracking-[-0.03em] text-[#225d50]">{{ orderBalanceLabel() }}</strong>
    </div>
  </div>

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <p class="text-[9px] leading-[1.5] text-[#919da0] m-0">
      El sistema registra la atención con tu usuario y la hora del servidor. Si el vale ya existe, se conserva su
      saldo y su historial.
    </p>
  </div>

  @if (error()) {
    <p class="text-[9px] leading-[1.5] text-[#919da0] text-[#a55a2c] m-0" role="alert">{{ error() }}</p>
  }

  <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
    <button type="submit" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover) w-full">Confirmar despacho</button>
  </div>
</form>

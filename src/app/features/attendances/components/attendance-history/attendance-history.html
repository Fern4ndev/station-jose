<div class="w-full overflow-x-auto">
  <table class="w-full border-collapse text-left [&_tbody_tr:hover]:bg-[rgba(238,247,244,0.5)] [&_tbody_tr:last-child>td]:border-b-0">
    <thead>
      <tr>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">FECHA Y HORA</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">VALE / ORDEN</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">GRIFERO</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">SEDE</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">GALONES</th>
        <th class="border-y border-[#edf0f0] bg-[rgba(244,247,246,0.65)] px-[13px] py-[10px] text-[10px] font-[620] whitespace-nowrap text-[#839095]">ESTADO</th>
      </tr>
    </thead>
    <tbody>
      @for (row of pageRows(); track row.id) {
        <tr>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">
            <span class="block text-[11px] font-[630] text-[#243941]">{{ row.date }} · {{ row.time }}</span>
          </td>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">
            <span class="block text-[11px] font-[630] text-[#243941]">{{ row.voucher }}</span>
            <span class="block mt-[4px] text-[10px] text-[#98a2a5]">{{ row.orderId }}</span>
          </td>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">{{ row.attendant }}</td>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">{{ row.branch }}</td>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">{{ gallons(row) }}</td>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]">
            <app-ui-status-badge [label]="row.status" tone="green" />
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="border-b border-[#eff2f2] px-[13px] py-[12px] text-[11px] whitespace-nowrap text-[#52636a]" colspan="6">
            <div class="p-[30px_16px] text-center text-[11px] text-[#8b989c]">
              No hay atenciones registradas para este perfil y sede.
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-table-pagination [first]="first()" [rows]="pageSize()" [totalRecords]="rows().length" (pageChange)="onPage($event)" />

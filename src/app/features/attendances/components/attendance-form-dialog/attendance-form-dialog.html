<app-ui-dialog
  [(visible)]="visible"
  title="Registrar atención"
  description="Valida el saldo de la orden y del vale antes de confirmar el despacho."
>
  <app-attendance-form
    [orders]="orders()"
    [vouchers]="vouchers()"
    [branch]="branch()"
    [branchLocked]="branchLocked()"
    [resetToken]="resetToken()"
    (register)="register.emit($event)"
  />

  <div dialogFooter class="flex w-full items-center justify-end gap-[8px] max-[760px]:flex-col-reverse">
    <button
      type="button"
      class="inline-flex min-h-[39px] w-full items-center justify-center rounded-[11px] border border-[#dce5e6] bg-white px-[13px] text-[11px] font-[600] text-[#4a5f66] transition-[background] hover:bg-[#f6f9f9] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] sm:w-auto"
      (click)="visible.set(false)"
    >
      Cancelar
    </button>
    <button
      type="submit"
      form="attendanceForm"
      [disabled]="!dirty()"
      class="inline-flex min-h-[39px] w-full items-center justify-center gap-[8px] rounded-[11px] border border-transparent bg-(--sanjose-primary-action) px-[13px] text-[11px] font-[620] whitespace-nowrap text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] transition-[background,box-shadow] hover:bg-(--sanjose-primary-action-hover) disabled:cursor-not-allowed disabled:opacity-45 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] sm:w-auto"
    >
      Confirmar despacho
    </button>
  </div>
</app-ui-dialog>

<app-ui-toast />

<div class="animate-[fadeIn_230ms_ease_both]">
  <app-ui-page-heading
    title="Registrar despacho"
    subtitle="Valida el saldo y registra los galones realmente entregados."
  >
    <button
      type="button"
      class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover)"
      (click)="registerOpen.set(true)"
    >
      <app-ui-icon name="plus" [size]="14" />
      Registrar
    </button>
  </app-ui-page-heading>

  <div
    class="grid grid-cols-[minmax(0,_1fr)_300px] gap-[13px] max-[1279px]:grid-cols-[minmax(0,_1fr)] max-[1279px]:gap-[10px]"
  >
    <app-ui-panel
      title="Historial de atenciones"
      subtitle="Las atenciones confirmadas no se editan ni eliminan desde esta vista."
    >
      <app-attendance-history [rows]="visible()" />
    </app-ui-panel>

    <div class="self-start">
      <app-ui-panel title="Últimos despachos" subtitle="Actividad registrada por los griferos">
        <app-ui-status-badge panelAction label="Hoy" tone="blue" />

        <app-attendance-recent [rows]="recent()" />

        <div panelFooter class="p-[0_17px_13px]">
          <button type="button" class="inline-flex min-h-[30px] cursor-pointer items-center gap-[5px] border-0 bg-transparent px-[4px] text-[10px] font-[630] text-(--sanjose-accent) focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]" (click)="goVouchers()">
            Consultar saldos de vales
          </button>
        </div>
      </app-ui-panel>
    </div>
  </div>

  <app-attendance-form-dialog
    [(visible)]="registerOpen"
    [orders]="availableOrders()"
    [vouchers]="vouchers()"
    [branch]="branch()"
    [branchLocked]="branchLocked()"
    [resetToken]="resetToken()"
    (register)="register($event)"
  />
</div>

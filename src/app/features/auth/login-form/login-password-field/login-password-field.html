<div>
  <label class="mb-2 block text-sm font-medium text-slate-800" for="password">Contraseña</label>
  <div class="relative">
    <input
      class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 pr-24 text-base text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-100"
      id="password" name="password" [type]="visible() ? 'text' : 'password'" [formControl]="control()"
      autocomplete="current-password" placeholder="Ingresa tu contraseña"
      [attr.aria-invalid]="control().invalid && (control().touched || showErrors())"
      aria-describedby="password-error"
    />
    <button
      class="absolute right-1 top-1 h-10 min-w-20 rounded-lg px-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 focus-visible:outline-offset-0"
      type="button" (click)="toggleVisibility.emit()"
      [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      [attr.aria-pressed]="visible()"
    >{{ visible() ? 'Ocultar' : 'Mostrar' }}</button>
  </div>
  <p class="mt-1 min-h-4 text-xs text-red-700" id="password-error" aria-live="polite">
    @if (control().invalid && (control().touched || showErrors())) {
      @if (control().hasError('required')) { Ingresa tu contraseña. }
      @else if (control().hasError('minlength')) { La contraseña debe tener al menos 8 caracteres. }
    }
  </p>
</div>

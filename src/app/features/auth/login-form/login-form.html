<form class="space-y-5" [formGroup]="form()" (ngSubmit)="submitLogin.emit()" [attr.aria-busy]="isSubmitting()">
  <app-login-email-field [control]="form().controls.email" [showErrors]="hasSubmitted()" />
  <app-login-password-field
    [control]="form().controls.password"
    [showErrors]="hasSubmitted()"
    [visible]="showPassword()"
    (toggleVisibility)="togglePassword.emit()"
  />

  <button
    class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-primary-700 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-900 focus-visible:outline-offset-2 disabled:cursor-wait disabled:opacity-70"
    type="submit" [disabled]="isSubmitting()"
  >
    @if (isSubmitting()) {
      <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
      Validando acceso…
    } @else { <span class="material-symbols-outlined" aria-hidden="true">login</span> Ingresar al sistema }
  </button>
</form>

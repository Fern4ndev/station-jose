<app-ui-dialog
  [(visible)]="visible"
  title="Agregar usuario"
  description="Asigna uno de los roles predefinidos. La oficina administra ambas sedes."
>
  <form id="userForm" class="grid grid-cols-2 gap-[13px] max-[760px]:grid-cols-1" (submit)="onSubmit($event)" novalidate>
    <div class="grid gap-[6px]">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserName">Nombre completo</label>
      <input
        id="newUserName"
        class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
        placeholder="Nombre y apellidos"
        [value]="name()"
        (input)="setName($event)"
      />
    </div>

    <div class="grid gap-[6px]">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserDni">DNI</label>
      <input
        id="newUserDni"
        class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
        inputmode="numeric"
        maxlength="8"
        placeholder="Número de documento"
        [value]="dni()"
        (input)="setDni($event)"
      />
    </div>

    <div class="grid gap-[6px] col-span-full max-[760px]:col-span-1">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserEmail">Correo electrónico</label>
      <input
        id="newUserEmail"
        class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d] placeholder:text-[#a5b1b4] read-only:bg-[#f7fafa] read-only:text-[#5f6f73] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)]"
        type="email"
        placeholder="nombre@estacion.pe"
        [value]="email()"
        (input)="setEmail($event)"
      />
    </div>

    <div class="grid gap-[6px]">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserRole">Rol</label>
      <p-select inputId="newUserRole" [options]="roleOptions" optionLabel="label" optionValue="value" [ngModel]="role()" (ngModelChange)="role.set($event)" [ngModelOptions]="{standalone:true}" styleClass="w-full" size="small" />
    </div>

    @if (showBranch()) {
      <div class="grid gap-[6px]">
        <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserBranch">Sede</label>
        <p-select inputId="newUserBranch" [options]="branchOptions()" optionLabel="label" optionValue="value" [ngModel]="branch()" (ngModelChange)="branch.set($event)" [ngModelOptions]="{standalone:true}" placeholder="Selecciona una sede" styleClass="w-full" size="small" />
        <span class="text-[9px] leading-[1.5] text-[#919da0]">No aplica al personal de oficina ni al administrador.</span>
      </div>
    }

    <div class="grid gap-[6px] col-span-full">
      <label class="mb-0 block text-[10px] font-[620] text-[#52646a]" for="newUserPassword">Contraseña inicial</label>
      <input id="newUserPassword" class="min-h-[39px] w-full rounded-[10px] border border-[#dce5e5] bg-white px-[11px] text-[11px] text-[#30464d]" type="password" autocomplete="new-password" minlength="8" [value]="password()" (input)="setPassword($event)" />
    </div>

    @if (error()) {
      <p class="text-[9px] leading-[1.5] text-[#919da0] text-[#a55a2c] m-0 [grid-column:1_/-1]" role="alert">
        {{ error() }}
      </p>
    }
  </form>

  <div dialogFooter class="flex justify-end gap-[8px]">
    <button type="button" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] border-[#dce5e6] bg-[rgba(255,255,255,0.72)] text-[#53656a] hover:bg-white" (click)="visible.set(false)">
      Cancelar
    </button>
    <button type="submit" form="userForm" class="inline-flex min-h-[39px] items-center justify-center gap-[8px] rounded-[11px] border border-transparent px-[13px] text-[11px] font-[620] whitespace-nowrap transition-[background,box-shadow] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[rgba(57,198,174,0.72)] bg-(--sanjose-primary-action) text-white shadow-[0_5px_12px_rgba(23,60,66,0.13)] hover:bg-(--sanjose-primary-action-hover)" [disabled]="saving()">
      {{ saving() ? 'Creando…' : 'Crear usuario' }}
    </button>
  </div>
</app-ui-dialog>

<app-ui-dialog
  [(visible)]="visible"
  title="Agregar usuario"
  description="Asigna uno de los roles predefinidos. La oficina administra ambas sedes."
>
  <form id="userForm" class="sanjose-form-grid" (submit)="onSubmit($event)" novalidate>
    <div class="sanjose-field">
      <label class="sanjose-label" for="newUserName">Nombre completo</label>
      <input
        id="newUserName"
        class="sanjose-input"
        placeholder="Nombre y apellidos"
        [value]="name()"
        (input)="setName($event)"
      />
    </div>

    <div class="sanjose-field">
      <label class="sanjose-label" for="newUserDni">DNI</label>
      <input
        id="newUserDni"
        class="sanjose-input"
        inputmode="numeric"
        maxlength="8"
        placeholder="Número de documento"
        [value]="dni()"
        (input)="setDni($event)"
      />
    </div>

    <div class="sanjose-field full">
      <label class="sanjose-label" for="newUserEmail">Correo electrónico</label>
      <input
        id="newUserEmail"
        class="sanjose-input"
        type="email"
        placeholder="nombre@estacion.pe"
        [value]="email()"
        (input)="setEmail($event)"
      />
    </div>

    <div class="sanjose-field">
      <label class="sanjose-label" for="newUserRole">Rol</label>
      <select id="newUserRole" class="sanjose-select" [value]="role()" (change)="setRole($event)">
        @for (option of roles; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    @if (showBranch()) {
      <div class="sanjose-field">
        <label class="sanjose-label" for="newUserBranch">Sede</label>
        <select
          id="newUserBranch"
          class="sanjose-select"
          [value]="branch()"
          (change)="setBranch($event)"
        >
          @for (option of branches; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
        <span class="sanjose-hint">No aplica al personal de oficina ni al administrador.</span>
      </div>
    }

    <p class="sanjose-hint m-0 [grid-column:1_/-1]">
      La cuenta requiere una clave temporal segura al integrarse con el backend.
    </p>

    @if (error()) {
      <p class="sanjose-hint sanjose-hint--error m-0 [grid-column:1_/-1]" role="alert">
        {{ error() }}
      </p>
    }
  </form>

  <div dialogFooter class="flex justify-end gap-[8px]">
    <button type="button" class="sanjose-button sanjose-button--secondary" (click)="visible.set(false)">
      Cancelar
    </button>
    <button type="submit" form="userForm" class="sanjose-button sanjose-button--primary">
      Crear usuario
    </button>
  </div>
</app-ui-dialog>

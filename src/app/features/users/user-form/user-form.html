<form class="grid gap-5" [formGroup]="form()" (ngSubmit)="save.emit()" [attr.aria-busy]="submitting()">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-1.5 text-sm">Nombres<input class="min-h-11 rounded-lg border px-3" formControlName="firstName" autocomplete="given-name" /></label>
    <label class="grid gap-1.5 text-sm">Apellidos<input class="min-h-11 rounded-lg border px-3" formControlName="lastName" autocomplete="family-name" /></label>
    <label class="grid gap-1.5 text-sm">DNI<input class="min-h-11 rounded-lg border px-3" formControlName="dni" inputmode="numeric" /></label>
    <label class="grid gap-1.5 text-sm">Correo electrónico<input class="min-h-11 rounded-lg border px-3" type="email" formControlName="email" autocomplete="email" /></label>
    <label class="grid gap-1.5 text-sm">Contraseña inicial<input class="min-h-11 rounded-lg border px-3" type="password" formControlName="password" autocomplete="new-password" /></label>
    <label class="grid gap-1.5 text-sm">Rol
      <select class="min-h-11 rounded-lg border px-3" formControlName="role"><option value="OFFICE">Oficina</option><option value="ATTENDANT">Grifero</option><option value="ADMIN">Administrador</option></select>
    </label>
    @if (form().controls.role.value === 'ATTENDANT') {
      <label class="grid gap-1.5 text-sm sm:col-span-2">Sede del grifero
        <select class="min-h-11 rounded-lg border px-3" formControlName="branchId"><option value="">Selecciona una sede</option>@for (branch of branches(); track branch.id) { <option [value]="branch.id">{{ branch.name }}</option> }</select>
      </label>
    }
  </div>
  @if (!enabled()) { <p class="rounded-lg bg-slate-50 p-3 text-sm text-slate-600" role="status">El registro de usuarios aún no está disponible.</p> }
  <div class="flex flex-wrap justify-end gap-3"><button class="min-h-11 rounded-lg border px-4 py-2 text-sm" type="button" (click)="cancel.emit()">Cancelar</button><button class="min-h-11 rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="!enabled() || submitting() || !canSubmit()">Crear usuario</button></div>
</form>

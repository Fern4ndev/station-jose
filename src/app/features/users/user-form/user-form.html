<form class="grid gap-5" [formGroup]="form()" (ngSubmit)="save.emit()" [attr.aria-busy]="submitting()">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-1.5 text-sm">Nombres<input class="min-h-11 rounded-lg border px-3" formControlName="firstName" autocomplete="given-name" />@if (form().controls.firstName.touched && form().controls.firstName.invalid) { <span class="text-red-700">Ingresa nombres válidos.</span> }</label>
    <label class="grid gap-1.5 text-sm">Apellidos<input class="min-h-11 rounded-lg border px-3" formControlName="lastName" autocomplete="family-name" />@if (form().controls.lastName.touched && form().controls.lastName.invalid) { <span class="text-red-700">Ingresa apellidos válidos.</span> }</label>
    <label class="grid gap-1.5 text-sm">DNI<input class="min-h-11 rounded-lg border px-3" formControlName="dni" inputmode="numeric" />@if (form().controls.dni.touched && form().controls.dni.invalid) { <span class="text-red-700">Ingresa un DNI válido.</span> }</label>
    <label class="grid gap-1.5 text-sm">Correo electrónico<input class="min-h-11 rounded-lg border px-3" type="email" formControlName="email" autocomplete="email" />@if (form().controls.email.touched && form().controls.email.invalid) { <span class="text-red-700">Ingresa un correo válido.</span> }</label>
    <label class="grid gap-1.5 text-sm">Contraseña inicial<input class="min-h-11 rounded-lg border px-3" type="password" formControlName="password" autocomplete="new-password" />@if (form().controls.password.touched && form().controls.password.invalid) { <span class="text-red-700">La contraseña debe tener entre 8 y 128 caracteres.</span> }</label>
    <label class="grid gap-1.5 text-sm">Rol
      <select class="min-h-11 rounded-lg border px-3" formControlName="role"><option value="OFFICE">Oficina</option><option value="ATTENDANT">Grifero</option></select>
    </label>
    @if (form().controls.role.value === 'ATTENDANT') {
      <label class="grid gap-1.5 text-sm sm:col-span-2">Sede del grifero
        <select class="min-h-11 rounded-lg border px-3" formControlName="branchId"><option value="">Selecciona una sede</option>@for (branch of branches(); track branch.id) { <option [value]="branch.id">{{ branch.name }}</option> }</select>
        @if (!branches().length) { <span class="text-amber-800">No hay sedes activas disponibles.</span> }
      </label>
    }
  </div>
  @if (!enabled()) { <p class="rounded-lg bg-slate-50 p-3 text-sm text-slate-600" role="status">El registro estará disponible cuando se carguen las sedes.</p> }
  <div class="flex flex-wrap justify-end gap-3"><button class="min-h-11 rounded-lg border px-4 py-2 text-sm" type="button" (click)="cancel.emit()">Cancelar</button><button class="inline-flex min-h-11 items-center gap-2 rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="!enabled() || submitting() || !canSubmit()"><span class="material-symbols-outlined" aria-hidden="true">person_add</span>Crear usuario</button></div>
</form>

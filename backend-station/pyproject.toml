[project]
name = "san-jose-fuel-control-api"
version = "0.1.0"
description = "Backend API for Estación de Servicio San José"
requires-python = ">=3.12"
dependencies = [
  "email-validator==2.3.0",
  "fastapi[standard]==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "PyMuPDF==1.26.7",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "reportlab==4.4.9",
  "rapidocr==3.10.0",
  "onnxruntime==1.32.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
